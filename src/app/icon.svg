<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="alchemystGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Background representing the console -->
  <rect width="512" height="512" rx="120" fill="#09090b" />
  
  <!-- Abstract 'A' / Networking Triangle with Glow -->
  <path d="M256 120 L400 380 L112 380 Z" fill="none" stroke="url(#alchemystGrad)" stroke-width="36" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Central Agent Core -->
  <circle cx="256" cy="230" r="32" fill="#10b981" filter="url(#glow)" />
  
  <!-- Circuit Lines -->
  <line x1="256" y1="262" x2="256" y2="380" stroke="#10b981" stroke-width="16" />
</svg>
